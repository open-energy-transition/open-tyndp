# Cycle handling
# - The CURRENT_CYCLE repository variable holds the year of the TYNDP cycle on master
#   (e.g. 2026). Set it in Settings > Secrets and variables > Actions > Variables.
# - This workflow acts only on a `tyndp-YYYY` branch with YYYY > CURRENT_CYCLE, i.e. the
#   next cycle under development. Archived cycle branches (e.g. `tyndp-2024`) are ignored.
# - Next cycle (e.g. 2028): create `tyndp-2028`; nothing else to change.
# - When `tyndp-2028` replaces master, set CURRENT_CYCLE to 2028 in the same step.
#   Otherwise the workflows still treat `tyndp-2028` as the next cycle, and the weekly merge
#   opens sync PRs into it. Without a newer branch, the workflows then do nothing.

name: Weekly merge master into the next-cycle branch

on:
  schedule:
  - cron: '0 6 * * 1'    # every Monday at 06:00 UTC
  workflow_dispatch:      # allows manual trigger from the Actions tab

concurrency:
  group: ${{ github.workflow }}

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  find-target:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      branch: ${{ steps.find.outputs.branch }}
    steps:
    - name: Find the next-cycle branch
      id: find
      shell: bash
      env:
        CURRENT_CYCLE: ${{ vars.CURRENT_CYCLE }}
      run: |
        if [[ ! $CURRENT_CYCLE =~ ^[0-9]{4}$ ]]; then
          echo "::error::Set the CURRENT_CYCLE repository variable to the TYNDP cycle on master (e.g. 2026)."
          exit 1
        fi
        branches=$(
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/tyndp-" --jq '.[].ref | ltrimstr("refs/heads/")' \
            | awk -F- -v c="$CURRENT_CYCLE" '/^tyndp-[0-9]{4}$/ && $2 > c'
        )
        if (( $(grep -c . <<< "$branches") > 1 )); then
          echo "::error::Several branches are newer than $CURRENT_CYCLE:" $branches
          exit 1
        fi
        if [[ -z $branches ]]; then
          echo "::notice::No tyndp-YYYY branch is newer than $CURRENT_CYCLE; nothing to merge."
        fi
        echo "branch=$branches" >> "$GITHUB_OUTPUT"

  merge:
    needs: find-target
    if: needs.find-target.outputs.branch != ''
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ needs.find-target.outputs.branch }}
      MERGE_BRANCH: weekly-merge-master-into-${{ needs.find-target.outputs.branch }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.find-target.outputs.branch }}
        fetch-depth: 0

    - name: Merge master
      id: merge
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git fetch origin master "$TARGET_BRANCH"

        # Continue an open sync branch rather than recreating it, so any conflict
        # resolution already pushed there survives and the push stays fast-forward.
        if git fetch origin "$MERGE_BRANCH"; then
          git checkout -B "$MERGE_BRANCH" FETCH_HEAD
        else
          git checkout -B "$MERGE_BRANCH" "origin/$TARGET_BRANCH"
        fi

        # A conflicted merge leaves nothing committed, so commit it as-is to keep
        # the PR reviewable; the marker grep below then reports it.
        git merge origin/master --no-edit || { git add -A && git commit --no-edit; }

        echo "changes=$(git rev-list --count "origin/$TARGET_BRANCH..HEAD")" >> "$GITHUB_OUTPUT"
        {
          echo 'conflicts<<EOF'
          git grep -lE '^<{7} ' -- || true
          echo EOF
        } >> "$GITHUB_OUTPUT"

    - name: Push merge branch
      if: steps.merge.outputs.changes != '0'
      run: git push origin "$MERGE_BRANCH"

    - name: Create or update PR
      if: steps.merge.outputs.changes != '0'
      env:
        CONFLICTS: ${{ steps.merge.outputs.conflicts }}
      run: |
        TESTS_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/test.yaml?query=branch%3A$MERGE_BRANCH"

        cat > pr-body.md <<EOF
        Automated weekly merge of \`master\` into \`$TARGET_BRANCH\`.

        > [!CAUTION]
        > **Do not squash-merge this PR** — use a regular merge commit. Squashing drops the
        > merge commit recording \`master\` as an ancestor of \`$TARGET_BRANCH\`, so every future
        > sync would replay all of \`master\` and re-raise the same conflicts indefinitely.

        EOF

        if [ -n "$CONFLICTS" ]; then
          echo "> [!WARNING]" >> pr-body.md
          echo "> **This branch contains conflict markers and does not build.** Resolve before merging:" >> pr-body.md
          printf '> - `%s`\n' $CONFLICTS >> pr-body.md
        else
          echo "No conflicts detected." >> pr-body.md
        fi

        cat >> pr-body.md <<EOF

        \`GITHUB_TOKEN\` PRs do not trigger \`pull_request\` workflows, so tests are dispatched
        separately and will not appear as checks below: [test runs for this branch]($TESTS_URL)
        EOF

        PR=$(gh pr list --head "$MERGE_BRANCH" --base "$TARGET_BRANCH" --state open --json number --jq '.[0].number // empty')
        if [ -n "$PR" ]; then
          gh pr edit "$PR" --body-file pr-body.md
        else
          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$MERGE_BRANCH" \
            --title "[github-actions.ci] Weekly sync: master into $TARGET_BRANCH" \
            --body-file pr-body.md
        fi

    - name: Dispatch tests against the merge branch
      if: steps.merge.outputs.changes != '0'
      run: gh workflow run test.yaml --ref "$MERGE_BRANCH"
