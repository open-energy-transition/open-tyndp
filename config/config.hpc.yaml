# Specify the name of the scenario(s) you want to run from config/scenarios.tyndp.yaml
run:
  name:
  - NT

remote:
  # Configure project specific files for sync_file rule
  sync_file:
  - cba/networks/project_t335_*.nc  # PINT
  - cba/networks/project_t339_*.nc  # TOOT
  - cba/networks/project_t1106_*.nc  # TOOT, offshore
  - cba/networks/project_s1001_*.nc  # PHS
  - cba/networks/project_s1013_*.nc  # CAES
  - cba/networks/project_s1035_*.nc  # battery
  # Configure exclusions for sync rule
  sync_exclude:
  - cba/networks/project_*

# Remote runs usually can't launch the explorer
launch_explorer: false

# Use 1H for high-resolution SB results
clustering:
  temporal:
    resolution_sector: 1H

# SB solver settings
solving:
  options:
    assign_all_duals: true
    include_objective_constant: false
  solver:
    name: gurobi
    options: gurobi-default
  partition: high-mem
  mem_mb: 45000
  runtime: 2h

cba:
  # Default high-res CBA projects
  projects:
  - t*
  - s*
  # MSV solver settings
  msv_extraction:
    solving:
      options:
        include_objective_constant: false
      solver:
        name: gurobi
        options: gurobi-default
      partition: high-mem
      mem_mb: 45000
      runtime: 1h

  # Rolling horizon solving settings
  solving:
    options:
      include_objective_constant: false
    partition: high-mem
    mem_mb: 10000
    runtime: 1h

    solver:
      name: highs
      options: highs-simplex
