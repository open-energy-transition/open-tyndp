# Specify the name of the scenario(s) you want to run from config/scenarios.tyndp.yaml
run:
  name:
  - NT

# Remote runs usually can't launch the explorer
launch_explorer: false

# Use 1H for high-resolution SB results
clustering:
  temporal:
    resolution_sector: 1H

# SB solver settings
solving:
  options:
    assign_all_duals: true
    include_objective_constant: false
  solver:
    name: gurobi
    options: gurobi-default
  partition: big
  mem_mb: 45000
  runtime: 2h

cba:
  # MSV solver settings
  msv_extraction:
    solving:
      options:
        include_objective_constant: false
      solver:
        name: gurobi
        options: gurobi-default
      partition: big
      mem_mb: 45000
      runtime: 2h
      solver_options:
        gurobi-default:
          BarConvTol: 1.0e-06

  # Rolling horizon solving settings
  solving:
    options:
      include_objective_constant: false
    partition: big
    mem_mb: 45000
    runtime: 2h

    solver:
      name: highs
      options: highs-simplex

    solver_options:
      highs-simplex:
        primal_feasibility_tolerance: 1.0e-06
        dual_feasibility_tolerance: 1.0e-06
