# example for syncing individual files from remote using `sync_files` rule
#remote:
#  sync_file:
#    results:
#    - cba/indicators_2030.csv
#    - cba/indicators_2040.csv

# Specify the name of the scenario(s) you want to run from config/scenarios.tyndp.yaml
run:
  name:
  - cba-gurobi-msv1e6-rh1e6-voll300-crossover-on
  - cba-highs-msv1e6-rh1e6-voll300-crossover-on
  - cba-gurobi-msv1e8-rh1e6-voll300-crossover-on
  - cba-gurobi-msv1e8-rh1e8-voll300-crossover-on
  - cba-highs-msv1e8-rh1e6-voll300-crossover-on
  - cba-highs-msv1e8-rh1e8-voll300-crossover-on

# Remote runs usually can't launch the explorer
launch_explorer: false

# Use 1H for high-resolution SB results
clustering:
  temporal:
    resolution_sector: 1H

# SB solver settings
solving:
  options:
    assign_all_duals: true
    include_objective_constant: false
  solver:
    name: gurobi
    options: gurobi-default
  partition: big
  mem_mb: 45000
  runtime: 2h

cba:
  # MSV solver settings
  msv_extraction:
    solving:
      options:
        include_objective_constant: false
      solver:
        name: gurobi
        options: gurobi-default
      partition: big
      mem_mb: 45000
      runtime: 2h

  # Rolling horizon solving settings
  solving:
    options:
      include_objective_constant: false
    partition: big
    mem_mb: 45000
    runtime: 2h

    solver:
      name: highs
      options: highs-simplex
